name: One-off unify work cards

on:
  push:
    branches:
      - fix/unify-work-cards

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-work-cards
          fetch-depth: 0

      - name: Unify portfolio work cards
        run: python scripts/unify_work_cards.py

      - name: Remove one-off files and commit
        run: |
          rm scripts/unify_work_cards.py
          rm .github/workflows/oneoff-unify-work-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-previews.js scripts/unify_work_cards.py .github/workflows/oneoff-unify-work-cards.yml
          git commit -m "fix: unify all twelve portfolio work cards"
          git push origin HEAD:fix/unify-work-cards
