<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">商品選定支援Webアプリのプレビュー</title><desc id="desc">商品検索、比較、スコアリング、意思決定を支援するWebアプリの模式図。</desc><rect width="1200" height="750" fill="#0b0b0c"/><circle cx="1020" cy="100" r="190" fill="#c88a4a" opacity=".08"/><g font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif"><text x="64" y="70" fill="#c88a4a" font-size="18" font-weight="700" letter-spacing="4">DECISION SUPPORT / WEB APP / API</text><text x="64" y="130" fill="#f2ede3" font-size="40" font-weight="700">迷い続ける商品選びを、比較できる選定フローへ</text><text x="64" y="170" fill="#aaa39a" font-size="20">検索結果を並べるだけでなく、条件・レビュー・価格を一つの比較軸へ整理。</text><g transform="translate(64 230)"><rect width="1072" height="380" rx="24" fill="#151519" stroke="#343039"/><g transform="translate(30 30)"><rect width="1012" height="54" rx="14" fill="#202027"/><circle cx="32" cy="27" r="8" fill="none" stroke="#c88a4a" stroke-width="3"/><path d="M38 33l10 10" stroke="#c88a4a" stroke-width="3"/><rect x="62" y="17" width="420" height="20" rx="10" fill="#343039"/><rect x="856" y="12" width="130" height="30" rx="15" fill="#7a1f2b"/><text x="921" y="33" text-anchor="middle" fill="#f2ede3" font-size="14" font-weight="700">COMPARE</text></g><g transform="translate(30 108)"><rect width="300" height="232" rx="16" fill="#202027" stroke="#48424c"/><rect x="22" y="22" width="92" height="92" rx="10" fill="#efede7"/><rect x="134" y="30" width="120" height="12" rx="6" fill="#d0cbc4"/><rect x="134" y="58" width="92" height="10" rx="5" fill="#69636e"/><rect x="22" y="142" width="256" height="10" rx="5" fill="#3a3540"/><rect x="22" y="166" width="180" height="10" rx="5" fill="#3a3540"/><text x="22" y="210" fill="#c88a4a" font-size="18" font-weight="700">SCORE 82</text></g><g transform="translate(350 108)"><rect width="300" height="232" rx="16" fill="#202027" stroke="#7a1f2b" stroke-width="2"/><rect x="22" y="22" width="92" height="92" rx