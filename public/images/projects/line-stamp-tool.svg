<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">LINEスタンプ画像加工ツールのプレビュー</title><desc id="desc">1枚の画像を分割し、背景除去、選択、ファイル名調整、ZIP生成まで行うブラウザツールの模式図。</desc><rect width="1200" height="750" fill="#0b0b0c"/><circle cx="1040" cy="90" r="180" fill="#06c755" opacity=".08"/><g font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif"><text x="64" y="70" fill="#c88a4a" font-size="18" font-weight="700" letter-spacing="4">SMALL TOOL / IMAGE PROCESSING / PRIVACY</text><text x="64" y="130" fill="#f2ede3" font-size="40" font-weight="700">40枚の画像加工を、ブラウザだけで一つのZIPへ</text><text x="64" y="170" fill="#aaa39a" font-size="20">外部送信なし。分割・透過・選択・命名・申請用ZIPまでを一画面で処理。</text><g transform="translate(64 230)"><rect width="1072" height="380" rx="24" fill="#151519" stroke="#343039"/><rect x="30" y="30" width="250" height="320" rx="16" fill="#202027"/><rect x="56" y="56" width="198" height="198" rx="12" fill="#efede7"/><g fill="#7a1f2b"><circle cx="105" cy="105" r="22"/><circle cx="205" cy="105" r="22"/><circle cx="105" cy="205" r="22"/><circle cx="205" cy="205" r="22"/></g><text x="155" y="292" text-anchor="middle" fill="#f2ede3" font-size="20" font-weight="700">1 Image</text><text x="155" y="320" text-anchor="middle" fill="#aaa39a" font-size="15">入力画像</text><path d="M304 190h70" stroke="#7a1f2b" stroke-width="3"/><path d="M366 181l14 9-14 9" fill="none" stroke="#7a1f2b" stroke-width="3"/><g transform="translate(392 42)"><rect width="340" height="296" rx="16" fill="#111114" stroke="#3b3540"/><text x="24" y="36" fill="#c88a4a" font-size="16" font-weight="700">PROCESS</text><g transform="translate(24 58)" fill="#efede7"><rect width="62" height="62" rx="8"/><rect x="74" width="62" height="62" rx="8"/><rect x="148" width="62" height="62" rx="8"/><rect x="222" width="62" height="62" rx="8"/><rect y="74" width="62" height="62" rx="8"/><rect x="74" y="74" width="62" height="62" rx="8"/><rect x="148" y="74" width="62" height="62" rx="8"/><rect x="222" y="74" width="62" height="62" rx="8"/></g><g fill="#06c755"><circle cx="76" cy="89" r="10"/><circle cx="150" cy="89" r="10"/><circle cx="224" cy="89" r="10"/><circle cx="298" cy="89" r="10"/></g><text x="24" y="232" fill="#f2ede3" font-size="18">Split → Remove BG → Select</text><text x="24" y="262" fill="#aaa39a" font-size="16">ファイル名・サイズをLINE申請仕様へ</text></g><path d="M754 190h70" stroke="#7a1f2b" stroke-width="3"/><path d="M816 181l14 9-14 9" fill="none" stroke="#7a1f2b" stroke-width="3"/><g transform="translate(848 84)"><rect width="188" height="212" rx="18" fill="#202027" stroke="#4f4854"/><path d="M55 52h78l20 25v82H35V52z" fill="#efede7"/><path d="M133 52v25h20" fill="none" stroke="#aaa39a" stroke-width="4"/><text x="94" y="128" text-anchor="middle" fill="#111114" font-size="30" font-weight="800">ZIP</text><text x="94" y="184" text-anchor="middle" fill="#f2ede3" font-size="18">申請用一式</text></g></g><text x="64" y="665" fill="#aaa39a" font-size="16">Public demo available · client-side processing · no upload</text></g></svg>