<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Computer vision automation preview</title>
  <desc id="desc">A generic app-game automation research interface showing screen capture, object detection, path planning, mouse input, freshness checks, logs, and automatic retry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b0c"/><stop offset="1" stop-color="#151214"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d191b"/><stop offset="1" stop-color="#111012"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="36" fill="url(#bg)"/>
  <rect x="58" y="52" width="1484" height="896" rx="28" fill="#0f0f10" stroke="#393234" filter="url(#shadow)"/>

  <g transform="translate(94 82)" font-family="Arial, sans-serif">
    <text x="0" y="28" fill="#b97750" font-size="15" font-weight="700" letter-spacing="3">COMPUTER VISION / AUTOMATION R&amp;D</text>
    <text x="0" y="71" fill="#f3ece4" font-size="32" font-weight="700">Screen → Detect → Plan → Input → Retry</text>
    <text x="810" y="34" fill="#8f8586" font-size="14" letter-spacing="2">REAL-DEVICE LOOP</text>
    <rect x="1190" y="0" width="220" height="46" rx="23" fill="#24181b" stroke="#6b3642"/><text x="1300" y="29" fill="#dca7b3" font-size="14" text-anchor="middle">LIVE LOGGING</text>
  </g>

  <g transform="translate(94 190)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="870" height="560" rx="24" fill="url(#panel)" stroke="#3a3335"/>
    <text x="28" y="42" fill="#b97750" font-size="14" font-weight="700" letter-spacing="2">CAPTURED BOARD</text>
    <text x="28" y="76" fill="#f3ece4" font-size="24" font-weight="700">Live screen recognition</text>
    <text x="28" y="102" fill="#8d8486" font-size="14">Generic visual objects · no game assets reproduced</text>

    <g transform="translate(34 132)">
      <rect width="802" height="384" rx="28" fill="#101214" stroke="#34373a"/>
      <g opacity=".9">
        <circle cx="82" cy="74" r="37" fill="#b7624a"/><circle cx="171" cy="66" r="34" fill="#4e7f8f"/><circle cx="252" cy="85" r="39" fill="#b69655"/><circle cx="342" cy="66" r="36" fill="#6e7650"/><circle cx="430" cy="86" r="40" fill="#a55b79"/><circle cx="523" cy="68" r="34" fill="#4e7f8f"/><circle cx="610" cy="86" r="39" fill="#b7624a"/><circle cx="704" cy="68" r="35" fill="#b69655"/>
        <circle cx="113" cy="164" r="39" fill="#4e7f8f"/><circle cx="202" cy="155" r="35" fill="#b7624a"/><circle cx="290" cy="178" r="41" fill="#4e7f8f"/><circle cx="381" cy="153" r="34" fill="#b69655"/><circle cx="469" cy="174" r="39" fill="#6e7650"/><circle cx="558" cy="154" r="36" fill="#a55b79"/><circle cx="650" cy="174" r="41" fill="#4e7f8f"/><circle cx="742" cy="158" r="35" fill="#b7624a"/>
        <circle cx="75" cy="265" r="36" fill="#b69655"/><circle cx="166" cy="253" r="40" fill="#6e7650"/><circle cx="258" cy="274" r="36" fill="#a55b79"/><circle cx="347" cy="250" r="40" fill="#4e7f8f"/><circle cx="440" cy="272" r="36" fill="#4e7f8f"/><circle cx="527" cy="250" r="39" fill="#4e7f8f"/><circle cx="618" cy="272" r="36" fill="#b69655"/><circle cx="710" cy="248" r="39" fill="#6e7650"/>
      </g>
      <g fill="none" stroke="#f4eee9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M112 164 C166 135 223 145 290 178 C341 204 390 223 440 272 C480 311 503 302 527 250"/>
      </g>
      <g fill="#fff"><circle cx="112" cy="164" r="10"/><circle cx="290" cy="178" r="10"/><circle cx="440" cy="272" r="10"/><circle cx="527" cy="250" r="10"/></g>
      <rect x="548" y="310" width="224" height="46" rx="23" fill="#1e1719" stroke="#6b3642"/><text x="660" y="339" fill="#efbec8" font-size="14" text-anchor="middle">CHAIN CANDIDATE: 4</text>
    </g>
  </g>

  <g transform="translate(990 190)" font-family="Arial, sans-serif">
    <g>
      <rect width="516" height="96" rx="18" fill="url(#panel)" stroke="#3a3335"/>
      <rect x="18" y="18" width="58" height="58" rx="14" fill="#21191b"/><text x="47" y="54" fill="#c68057" font-size="22" font-weight="700" text-anchor="middle">01</text>
      <text x="94" y="38" fill="#b97750" font-size="12" font-weight="700" letter-spacing="2">CAPTURE</text><text x="94" y="67" fill="#f0e8e1" font-size="19" font-weight="700">Screen frame acquisition</text>
    </g>
    <g transform="translate(0 112)">
      <rect width="516" height="96" rx="18" fill="url(#panel)" stroke="#3a3335"/>
      <rect x="18" y="18" width="58" height="58" rx="14" fill="#21191b"/><text x="47" y="54" fill="#c68057" font-size="22" font-weight="700" text-anchor="middle">02</text>
      <text x="94" y="38" fill="#b97750" font-size="12" font-weight="700" letter-spacing="2">DETECT</text><text x="94" y="67" fill="#f0e8e1" font-size="19" font-weight="700">Object / state recognition</text>
    </g>
    <g transform="translate(0 224)">
      <rect width="516" height="96" rx="18" fill="url(#panel)" stroke="#3a3335"/>
      <rect x="18" y="18" width="58" height="58" rx="14" fill="#21191b"/><text x="47" y="54" fill="#c68057" font-size="22" font-weight="700" text-anchor="middle">03</text>
      <text x="94" y="38" fill="#b97750" font-size="12" font-weight="700" letter-spacing="2">PLAN</text><text x="94" y="67" fill="#f0e8e1" font-size="19" font-weight="700">Chain / route selection</text>
    </g>
    <g transform="translate(0 336)">
      <rect width="516" height="96" rx="18" fill="url(#panel)" stroke="#3a3335"/>
      <rect x="18" y="18" width="58" height="58" rx="14" fill="#21191b"/><text x="47" y="54" fill="#c68057" font-size="22" font-weight="700" text-anchor="middle">04</text>
      <text x="94" y="38" fill="#b97750" font-size="12" font-weight="700" letter-spacing="2">INPUT</text><text x="94" y="67" fill="#f0e8e1" font-size="19" font-weight="700">Mouse swipe / click action</text>
    </g>
    <g transform="translate(0 448)">
      <rect width="516" height="112" rx="18" fill="#1d1618" stroke="#5a333c"/>
      <rect x="18" y="22" width="58" height="58" rx="14" fill="#321a20"/><text x="47" y="58" fill="#e398a7" font-size="22" font-weight="700" text-anchor="middle">05</text>
      <text x="94" y="40" fill="#d68b9a" font-size="12" font-weight="700" letter-spacing="2">FRESHNESS / RETRY</text><text x="94" y="69" fill="#f5ece8" font-size="19" font-weight="700">Reject stale actions</text><text x="94" y="91" fill="#9c8e91" font-size="13">End detection → Retry → Start</text>
    </g>
  </g>

  <g transform="translate(94 782)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="1412" height="122" rx="22" fill="#151315" stroke="#44373a"/>
    <g transform="translate(24 20)"><text x="0" y="18" fill="#b97750" font-size="12" font-weight="700" letter-spacing="2">MEASURED LOOP</text><text x="0" y="50" fill="#f3ece4" font-size="22" font-weight="700">Recognition is not enough — timing matters.</text><text x="0" y="78" fill="#8d8486" font-size="14">Frame age, processing time, action logs, safety gates and strategy separation are tracked on real-device tests.</text></g>
    <g transform="translate(988 22)">
      <rect width="172" height="78" rx="18" fill="#211d1e" stroke="#493c40"/><text x="86" y="29" fill="#8f8586" font-size="11" text-anchor="middle">FRESHNESS RULE</text><text x="86" y="58" fill="#f0e8e1" font-size="23" font-weight="700" text-anchor="middle">&lt; 80 ms</text>
      <rect x="188" width="188" height="78" rx="18" fill="#211d1e" stroke="#493c40"/><text x="282" y="29" fill="#8f8586" font-size="11" text-anchor="middle">STRATEGY LAYER</text><text x="282" y="58" fill="#f0e8e1" font-size="18" font-weight="700" text-anchor="middle">EXTENSIBLE</text>
    </g>
  </g>
</svg>