<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">AI SNS運用システムのプレビュー</title><desc id="desc">AIとの会話からGitHub Actions、Threads投稿、履歴、分析までをつなぐ運用フローの模式図。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0b0c"/><stop offset="1" stop-color="#141116"/></linearGradient></defs>
<rect width="1200" height="750" fill="url(#bg)"/><circle cx="1040" cy="80" r="180" fill="#7a1f2b" opacity=".12"/>
<g font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif"><text x="64" y="70" fill="#c88a4a" font-size="18" font-weight="700" letter-spacing="4">AI OPERATIONS / SNS / AUTOMATION</text><text x="64" y="130" fill="#f2ede3" font-size="40" font-weight="700">AIとの会話から投稿・履歴・分析までを一つの運用へ</text><text x="64" y="170" fill="#aaa39a" font-size="20">投稿予約だけでなく、画像・ツリー・復旧・分析・トークン管理まで接続。</text>
<g transform="translate(64 235)"><rect width="1072" height="360" rx="24" fill="#151519" stroke="#343039"/>
<g transform="translate(34 52)"><rect width="180" height="110" rx="16" fill="#202027" stroke="#6f5b49"/><text x="90" y="48" text-anchor="middle" fill="#f2ede3" font-size="24" font-weight="700">AI Chat</text><text x="90" y="80" text-anchor="middle" fill="#aaa39a" font-size="16">指示・原稿・画像</text></g>
<path d="M236 107h86" stroke="#7a1f2b" stroke-width="3"/><path d="M314 98l14 9-14 9" fill="none" stroke="#7a1f2b" stroke-width="3"/>
<g transform="translate(330 52)"><rect width="180" height="110" rx="16" fill="#202027" stroke="#6f5b49"/><text x="90" y="48" text-anchor="middle" fill="#f2ede3" font-size="24" font-weight="700">GitHub</text><text x="90" y="80" text-anchor="middle" fill="#aaa39a" font-size="16">履歴・設定・素材</text></g>
<path d="M532 107h86" stroke="#7a1f2b" stroke-width="3"/><path d="M610 98l14 9-14 9" fill="none" stroke="#7a1f2b" stroke-width="3"/>
<g transform="translate(626 52)"><rect width="180" height="110" rx="16" fill="#202027" stroke="#6f5b49"/><text x="90" y="48" text-anchor="middle" fill="#f2ede3" font-size="24" font-weight="700">Actions</text><text x="90" y="80" text-anchor="middle" fill="#aaa39a" font-size="16">予約・投稿・復旧</text></g>
<path d="M828 107h86" stroke="#7a1f2b" stroke-width="3"/><path d="M906 98l14 9-14 9" fill="none" stroke="#7a1f2b" stroke-width="3"/>
<g transform="translate(922 52)"><rect width="116" height="110" rx="16" fill="#202027" stroke="#6f5b49"/><text x="58" y="48" text-anchor="middle" fill="#f2ede3" font-size="22" font-weight="700">Threads</text><text x="58" y="80" text-anchor="middle" fill="#aaa39a" font-size="14">公開</text></g>
<g transform="translate(180 226)"><rect width="712" height="84" rx="14" fill="#111114" stroke="#3b3540"/><text x="26" y="34" fill="#c88a4a" font-size="16" font-weight="700">FEEDBACK LOOP</text><text x="26" y="62" fill="#f2ede3" font-size="18">投稿履歴 → エラー記録 → Insights → 次の投稿判断</text><path d="M580 42h92" stroke="#c88a4a" stroke-width="3"/><circle cx="686" cy="42" r="8" fill="#7a1f2b"/></g>
</g><text x="64" y="660" fill="#aaa39a" font-size="16">Operational prototype · GitHub Actions / API / analytics workflow</text></g></svg>