<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">AI LINEスタンプ制作・販売のプレビュー</title><desc id="desc">AIで表情を作り、スタンプシートを生成し、画像調整、LINE Creators Marketへの申請、販売まで進めた制作フローの模式図。</desc><rect width="1200" height="750" fill="#0b0b0c"/><circle cx="1035" cy="90" r="190" fill="#06c755" opacity=".09"/><g font-family="system-ui,-apple-system,'Noto Sans JP',sans-serif"><text x="64" y="70" fill="#c88a4a" font-size="18" font-weight="700" letter-spacing="4">AI CREATIVE / LINE STICKERS / SALES</text><text x="64" y="130" fill="#f2ede3" font-size="40" font-weight="700">AIで40個を作るところから、申請・販売まで実際に回す</text><text x="64" y="170" fill="#aaa39a" font-size="20">生成だけで終わらず、表情設計・シート化・透過・申請仕様・審査対応まで検証。</text><g transform="translate(64 226)"><rect width="1072" height="390" rx="24" fill="#151519" stroke="#343039"/><g transform="translate(30 34)"><rect width="410" height="322" rx="18" fill="#202027"/><text x="24" y="38" fill="#c88a4a" font-size="16" font-weight="700">STICKER SHEET</text><g transform="translate(24 60)"><g fill="#efede7"><rect width="78" height="78" rx="16"/><rect x="94" width="78" height="78" rx="16"/><rect x="188" width="78" height="78" rx="16"/><rect x="282" width="78" height="78" rx="16"/><rect y="94" width="78" height="78" rx="16"/><rect x="94" y="94" width="78" height="78" rx="16"/><rect x="188" y="94" width="78" height="78" rx="16"/><rect x="282" y="94" width="78" height="78" rx="16"/></g><g fill="#7a1f2b"><circle cx="39" cy="39" r="19"/><circle cx="133" cy="39" r="19"/><circle cx="227" cy="39" r="19"/><circle cx="321" cy="39" r="19"/><circle cx="39" cy="133" r="19"/><circle cx="133" cy="133" r="19"/><circle cx="227" cy="133" r="19"/><circle cx="321" cy="133" r="19"/></g><g stroke="#f2ede3" stroke-width="3" stroke-linecap="round"><path d="M31 37h16M35 47c5 5 9 5 14 0"/><path d="M125 34l16 10M125 44l16-10"/><path d="M219 39h16M223 49c5-5 9-5 14 0"/><path d="M313 35h16M313 45h16"/></g></g><text