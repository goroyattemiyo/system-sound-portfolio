<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Web Media Studio preview</title>
  <desc id="desc">A dark browser media studio interface showing player, library, recorder, FFmpeg tools, and a floating mini player.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#171315"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1a1b"/>
      <stop offset="1" stop-color="#121112"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="36" fill="url(#bg)"/>
  <rect x="58" y="52" width="1484" height="896" rx="28" fill="#0f0f10" stroke="#3a3335" filter="url(#shadow)"/>

  <g transform="translate(94 82)">
    <rect x="0" y="0" width="1412" height="88" rx="18" fill="#151315" stroke="#3a3335"/>
    <g transform="translate(24 18)">
      <path d="M28 0 56 28 28 56 0 28Z" fill="none" stroke="#bb744a" stroke-width="8" stroke-linejoin="round"/>
      <path d="M17 19h7l4 18 4-18h7" fill="none" stroke="#f3ece4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="98" y="38" fill="#f3ece4" font-size="27" font-family="Arial, sans-serif" font-weight="700" letter-spacing="4">WEB MEDIA STUDIO</text>
    <text x="98" y="64" fill="#8f8586" font-size="15" font-family="Arial, sans-serif" letter-spacing="2">LOCAL-FIRST PWA MEDIA WORKSPACE</text>
    <g transform="translate(1038 21)" font-family="Arial, sans-serif" font-size="14">
      <rect width="160" height="44" rx="22" fill="#211b1d" stroke="#55454a"/><text x="80" y="28" fill="#d8cfc9" text-anchor="middle">PWA READY</text>
      <rect x="174" width="176" height="44" rx="22" fill="#24181b" stroke="#6b3642"/><text x="262" y="28" fill="#dca7b3" text-anchor="middle">LOCAL FIRST</text>
    </g>
  </g>

  <g transform="translate(94 194)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="866" height="554" rx="24" fill="url(#panel)" stroke="#3a3335"/>
    <text x="30" y="42" fill="#b97750" font-size="15" font-weight="700" letter-spacing="2">PLAYER</text>
    <text x="30" y="82" fill="#f3ece4" font-size="30" font-weight="700">Local media playback</text>
    <text x="30" y="112" fill="#91898a" font-size="16">Audio / Video · Playlist · A-B Loop · Resume · Media Session</text>

    <g transform="translate(30 148)">
      <rect width="806" height="252" rx="22" fill="#0d0d0e" stroke="#332f30"/>
      <g transform="translate(42 38)">
        <circle cx="92" cy="88" r="82" fill="#151214" stroke="#473438"/>
        <circle cx="92" cy="88" r="58" fill="none" stroke="#7a1f2b" stroke-width="3" stroke-dasharray="8 8"/>
        <path d="M72 46 128 88 72 130Z" fill="#d08a5a"/>
      </g>
      <text x="248" y="70" fill="#f2ebe4" font-size="22" font-weight="700">Midnight Session.mp3</text>
      <text x="248" y="99" fill="#91898a" font-size="15">Saved locally · Queue 03 / 12</text>
      <rect x="248" y="136" width="480" height="8" rx="4" fill="#2f292b"/>
      <rect x="248" y="136" width="292" height="8" rx="4" fill="#a45a36"/>
      <circle cx="540" cy="140" r="8" fill="#f0e8e0"/>
      <text x="248" y="174" fill="#d7ceca" font-size="15">02:48</text>
      <text x="691" y="174" fill="#7f7678" font-size="15">04:36</text>
      <g transform="translate(248 196)">
        <rect width="98" height="34" rx="17" fill="#211d1e" stroke="#463b3e"/><text x="49" y="22" fill="#ddd5cf" font-size="13" text-anchor="middle">-10 sec</text>
        <rect x="110" width="118" height="34" rx="17" fill="#7a1f2b"/><text x="169" y="22" fill="#fff3ef" font-size="13" text-anchor="middle">PAUSE</text>
        <rect x="240" width="98" height="34" rx="17" fill="#211d1e" stroke="#463b3e"/><text x="289" y="22" fill="#ddd5cf" font-size="13" text-anchor="middle">+10 sec</text>
        <rect x="350" width="112" height="34" rx="17" fill="#211d1e" stroke="#463b3e"/><text x="406" y="22" fill="#ddd5cf" font-size="13" text-anchor="middle">A-B LOOP</text>
      </g>
    </g>

    <g transform="translate(30 424)">
      <rect width="252" height="92" rx="16" fill="#151315" stroke="#3c3436"/>
      <text x="18" y="29" fill="#b97750" font-size="12" font-weight="700">BACKGROUND</text>
      <text x="18" y="56" fill="#f0e8e1" font-size="17">Media Session</text>
      <text x="18" y="78" fill="#81787a" font-size="13">Lock-screen controls</text>
      <rect x="276" width="252" height="92" rx="16" fill="#151315" stroke="#3c3436"/>
      <text x="294" y="29" fill="#b97750" font-size="12" font-weight="700">QUEUE</text>
      <text x="294" y="56" fill="#f0e8e1" font-size="17">Named playlists</text>
      <text x="294" y="78" fill="#81787a" font-size="13">Persistent order / resume</text>
      <rect x="552" width="254" height="92" rx="16" fill="#151315" stroke="#3c3436"/>
      <text x="570" y="29" fill="#b97750" font-size="12" font-weight="700">VISUAL</text>
      <text x="570" y="56" fill="#f0e8e1" font-size="17">Switchable skins</text>
      <text x="570" y="78" fill="#81787a" font-size="13">Player visualization</text>
    </g>
  </g>

  <g transform="translate(986 194)" font-family="Arial, sans-serif">
    <g>
      <rect width="520" height="164" rx="22" fill="url(#panel)" stroke="#3a3335"/>
      <text x="24" y="36" fill="#b97750" font-size="14" font-weight="700" letter-spacing="2">LIBRARY</text>
      <text x="24" y="70" fill="#f2ebe4" font-size="23" font-weight="700">Persistent local media</text>
      <text x="24" y="98" fill="#91898a" font-size="14">IndexedDB · Folder / Multi-file · Save locally</text>
      <g transform="translate(24 118)"><rect width="136" height="28" rx="14" fill="#211d1e"/><text x="68" y="19" fill="#d7ceca" font-size="12" text-anchor="middle">PLAY NOW</text><rect x="148" width="136" height="28" rx="14" fill="#211d1e"/><text x="216" y="19" fill="#d7ceca" font-size="12" text-anchor="middle">PLAY NEXT</text></g>
    </g>
    <g transform="translate(0 184)">
      <rect width="520" height="164" rx="22" fill="url(#panel)" stroke="#3a3335"/>
      <text x="24" y="36" fill="#b97750" font-size="14" font-weight="700" letter-spacing="2">RECORDER</text>
      <text x="24" y="70" fill="#f2ebe4" font-size="23" font-weight="700">Mic / Tab audio capture</text>
      <text x="24" y="98" fill="#91898a" font-size="14">Mic · Tab audio · Tab + Mic · Saved takes</text>
      <circle cx="470" cy="76" r="24" fill="#7a1f2b"/><circle cx="470" cy="76" r="8" fill="#ffd8dc"/>
      <g transform="translate(24 118)"><rect width="136" height="28" rx="14" fill="#211d1e"/><text x="68" y="19" fill="#d7ceca" font-size="12" text-anchor="middle">RECORD</text><rect x="148" width="136" height="28" rx="14" fill="#211d1e"/><text x="216" y="19" fill="#d7ceca" font-size="12" text-anchor="middle">SAVE TAKE</text></g>
    </g>
    <g transform="translate(0 368)">
      <rect width="520" height="186" rx="22" fill="url(#panel)" stroke="#3a3335"/>
      <text x="24" y="36" fill="#b97750" font-size="14" font-weight="700" letter-spacing="2">FFMPEG TOOLS</text>
      <text x="24" y="70" fill="#f2ebe4" font-size="23" font-weight="700">Video → Audio</text>
      <text x="24" y="98" fill="#91898a" font-size="14">Original · MP3 192 kbps · WAV 48 kHz</text>
      <rect x="24" y="122" width="472" height="8" rx="4" fill="#2f292b"/><rect x="24" y="122" width="344" height="8" rx="4" fill="#a45a36"/>
      <text x="24" y="156" fill="#7f7678" font-size="12">Browser-side processing · lazy load</text>
    </g>
  </g>

  <g transform="translate(154 786)" font-family="Arial, sans-serif">
    <rect width="1292" height="118" rx="22" fill="#171415" stroke="#4b3a3e" filter="url(#shadow)"/>
    <text x="24" y="31" fill="#b97750" font-size="12" font-weight="700" letter-spacing="2">FLOATING MINI PLAYER</text>
    <text x="24" y="64" fill="#f3ece4" font-size="20" font-weight="700">Midnight Session.mp3</text>
    <text x="24" y="91" fill="#8b8284" font-size="13">Playback stays alive while navigating WMS tools</text>
    <g transform="translate(920 28)"><circle cx="32" cy="32" r="30" fill="#211d1e" stroke="#493d40"/><path d="M39 20 25 32 39 44Z" fill="#d9cfc9"/><circle cx="110" cy="32" r="30" fill="#7a1f2b"/><rect x="102" y="21" width="6" height="22" fill="#fff1ed"/><rect x="113" y="21" width="6" height="22" fill="#fff1ed"/><circle cx="188" cy="32" r="30" fill="#211d1e" stroke="#493d40"/><path d="M181 20 195 32 181 44Z" fill="#d9cfc9"/></g>
  </g>
</svg>